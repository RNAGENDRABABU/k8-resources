apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx
  
  labels:
    project: roboshop
    purpose: rs-demo
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      purpose: rs-demo
      tier: frontend
  template:
    metadata:
      labels:
        project: roboshop
        purpose: rs-demo
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:stable-alpine3.24-perl